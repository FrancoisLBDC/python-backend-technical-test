services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-currency}
      POSTGRES_USER: ${POSTGRES_USER:-currency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-currency-pwd}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-currency}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-currency}
      POSTGRES_USER: ${POSTGRES_USER:-currency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-currency-pwd}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
