[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Domain exceptions are named after the failure (UnknownCurrency, RateNotFound...),
# not suffixed with "Error", for readability at the call site.
"domain/exceptions.py" = ["N818"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["domain", "application", "infrastructure"]
omit = ["*/migrations/*"]
